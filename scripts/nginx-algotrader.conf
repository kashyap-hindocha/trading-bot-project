# Reverse proxy: public HTTP on port 80 -> uvicorn on 127.0.0.1:8000
# Install: see scripts/setup_nginx_port80.sh
#
# WebSockets are under /ws/ (e.g. /ws/dashboard). No `map` block — avoids 500s when
# `$connection_upgrade` is not applied correctly on some default nginx layouts.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Dashboard live updates (WebSocket)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Everything else (/, /api/*, /health, static, etc.)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
